name: Build Kernel with Lindroid DRM

on:
  workflow_dispatch:

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          path: kernel

      - name: Checkout Lindroid DRM Patch
        uses: actions/checkout@v3
        with:
          repository: ${{ env.PATCH_REPO }}
          path: drm-dkms

      - name: Setup Dependencies
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y \
            nano bc bison ca-certificates curl flex gcc git \
            libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make \
            clang gcc-arm-linux-gnueabi software-properties-common build-essential \
            libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev \
            libreadline-dev libbz2-dev libsqlite3-dev \
            pigz python2 python3 cpio lld llvm libtinfo5 lz4 neofetch \
            dos2unix
          
          # cek environment
          neofetch
          # convert Kconfig file biar gak error CRLF
          dos2unix init/Kconfig || true
          dos2unix drivers/perf_mgr/Kconfig || true   

      - name: Apply Lindroid DRM Patch
        working-directory: kernel
        run: |
          echo "🔧 Applying Lindroid DRM patch..."
          if ! grep -q "lindroid-drm" drivers/Makefile; then
            echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          fi
          if ! grep -q "lindroid-drm" drivers/Kconfig; then
            echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig
          fi

          rm -rf drivers/lindroid-drm
          mkdir -p drivers/lindroid-drm
          cp -r ../drm-dkms/* drivers/lindroid-drm/

      - name: Debug Lindroid DRM
        working-directory: kernel
        run: |
          echo "=== DEBUG: drivers/lindroid-drm ==="
          ls -R drivers/lindroid-drm || true
          grep -i "lindroid" drivers/Makefile
          grep -i "lindroid" drivers/Kconfig

      - name: Kernel Defconfig
        working-directory: kernel
        run: |
          DEFCONFIG_NAME=wirus_defconfig
          ARCH=arm64
          VERSION=Nethunter_WirusMOD_r8q_v4.0.1

          BUILD_CROSS_COMPILE=$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          KERNEL_LLVM_BIN=$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          KERNEL_MAKE_ENV="DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-${VERSION}"

          mkdir -p ../out
          make -j$(nproc) -C $PWD O=../out $KERNEL_MAKE_ENV \
            ARCH=$ARCH CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE CFP_CC=$KERNEL_LLVM_BIN $DEFCONFIG_NAME

      - name: Build Kernel
        working-directory: kernel
        run: |
          BUILD_CROSS_COMPILE=$PWD/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          KERNEL_LLVM_BIN=$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          KERNEL_MAKE_ENV="DTC_EXT=$PWD/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-Nethunter_WirusMOD_r8q_v4.0.1"

          make -j$(nproc) -C $PWD O=../out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE CFP_CC=$KERNEL_LLVM_BIN 2>&1 | tee -a ../out/build.log

      - name: Check Lindroid DRM Build
        run: |
          if grep -q "drivers/lindroid-drm/" out/build.log; then
            echo "✅ Lindroid DRM built successfully"
          else
            echo "⚠️ Lindroid DRM NOT built (check config or source)"
          fi

      - name: Pack Boot Image + DTB
        working-directory: kernel
        run: |
          CHIPSET_NAME=kona
          VARIANT=r8q
          DTS_DIR=../out/arch/arm64/boot/dts

          [ -e ../out/arch/arm64/boot/Image.gz ] && cp ../out/arch/arm64/boot/Image.gz ../out/Image.gz
          if [ -e ../out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb ../out/Image.gz-dtb

            DTBO_FILES=$(find ${DTS_DIR}/samsung/ -name ${CHIPSET_NAME}-sec-${VARIANT}-*-r*.dtbo)
            cat ${DTS_DIR}/vendor/qcom/*.dtb > ../out/dtb.img
            $PWD/tools/mkdtimg create ../out/dtbo.img --page_size=4096 ${DTBO_FILES}
          fi

      - name: Create Flashable Zip
        working-directory: kernel
        run: |
          VARIANT=r8q
          VERSION=Nethunter_WirusMOD_${VARIANT}_v4.0.1

          if [ ! -d ../AnyKernel3 ]; then
            cp -rf AnyKernel3 ../AnyKernel3
          fi

          [ -e ../${VERSION}.zip ] && rm ../${VERSION}.zip
          if [ -e ../out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb ../AnyKernel3/zImage
          elif [ -e ../out/arch/arm64/boot/Image.gz ]; then
            cp ../out/arch/arm64/boot/Image.gz ../AnyKernel3/zImage
          fi

          cd ../AnyKernel3
          mkdir -p ../build/$VARIANT/modules
          zip -r9 ../build/$VARIANT/${VERSION}.zip * -x .git README.md *placeholder

      - name: Collect Artifacts
        run: |
          mkdir -p artifacts
          cp -vf out/Image.gz* artifacts/ || true
          cp -vf out/dtb.img artifacts/ || true
          cp -vf out/dtbo.img artifacts/ || true
          cp -vf build/r8q/*.zip artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build
          path: artifacts
