name: Smart Kernel Patch + Sync Upstream

on:
  schedule:
    - cron: "0 0 * * *"  # run daily
  workflow_dispatch:    # run manually

permissions:
  contents: write

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
  KERNEL_DIR: kernel

jobs:
  apply-and-sync-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get initial hash
        id: get-initial-hash
        run: echo "init_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout Lindroid DRM Patch
        uses: actions/checkout@v3
        with:
          repository: ${{ env.PATCH_REPO }}
          path: drm-dkms

      - name: Apply Lindroid DRM Patch
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Pastikan folder drivers/lindroid-drm ada
          mkdir -p drivers/lindroid-drm

          # Salin semua file patch dari drm-dkms
          rsync -a ../drm-dkms/ drivers/lindroid-drm/

          # Kalau folder masih kosong, tambahkan .gitkeep
          if [ -z "$(ls -A drivers/lindroid-drm)" ]; then
            touch drivers/lindroid-drm/.gitkeep
          fi

          # Buat Makefile & Kconfig jika belum ada
          [ ! -f drivers/Makefile ] && touch drivers/Makefile
          [ ! -f drivers/Kconfig ] && touch drivers/Kconfig

          # Tambahkan modul & Kconfig jika belum ada
          grep -qxF 'obj-y += lindroid-drm/' drivers/Makefile || echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          grep -qxF 'source "drivers/lindroid-drm/Kconfig"' drivers/Kconfig || echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit Patch Changes if Changed
        run: |
          git add drivers/lindroid-drm drivers/Makefile drivers/Kconfig
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Apply/update Lindroid DRM patch"
            ORIGIN_URL=$(git remote get-url origin)
            git remote set-url origin "${ORIGIN_URL/https:\/\//https:\/\/${{ github.token }}@}"
            git push origin $(git branch --show-current) --force-with-lease
          fi

      - name: Update lindroid-drm-loopback from Upstream
        run: |
          git -C ${{ env.KERNEL_DIR }}/drivers/lindroid-drm fetch -a -t
          git -C ${{ env.KERNEL_DIR }}/drivers/lindroid-drm checkout origin/master

      - uses: archiemeng/rebase-upstream-action@master
        with:
          branch: ${{ github.ref_name }}
          depth: 0

      - name: Get current hash
        id: get-current-hash
        run: echo "cur_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Trigger Build Workflow if Patch Updated
        uses: benc-uk/workflow-dispatch@v1.2.4
        if: ${{ steps.get-initial-hash.outputs.init_hash != steps.get-current-hash.outputs.cur_hash }}
        with:
          workflow: build.yml
