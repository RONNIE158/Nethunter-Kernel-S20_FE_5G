name: Terapkan Patch dan Submodule Lindroid-DRM-Loopback
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # Opsional: harian jam 00:00 UTC

permissions:
  contents: write

jobs:
  apply-patch-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Konfigurasi Git untuk Actions
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

      - name: Inisialisasi dan update submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Tambahkan submodule Lindroid-DRM-Loopback jika belum ada
        run: |
          if [ ! -d "drivers/lindroid-drm" ]; then
            mkdir -p drivers
            git submodule add -b master https://github.com/Linux-on-droid/lindroid-drm-loopback.git drivers/lindroid-drm
            git add .gitmodules drivers/lindroid-drm
            git commit -m "Tambahkan submodule lindroid-drm-loopback"
          else
            echo "Submodule sudah ada, tidak ada perubahan"
          fi

      - name: Terapkan patch Lindroid-DRM ke kernel
        run: |
          grep -qxF 'obj-y += lindroid-drm/' drivers/Makefile || echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          grep -qxF 'source "drivers/lindroid-drm/Kconfig"' drivers/Kconfig || echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig
          echo "Patch Lindroid-DRM diterapkan ke Makefile dan Kconfig"

      - name: Terapkan konfigurasi Lindroid ke semua defconfig lama
        run: |
          DEFCONFIG_DIR="arch/arm64/configs"
          CONFIGS=(
            "CONFIG_LINDROID=y"
            "CONFIG_SYSVIPC=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_DRM_LINDROID_EVDI=y"
          )
          for file in $DEFCONFIG_DIR/*; do
            [ -f "$file" ] || continue
            echo "Memperbarui $file ..."
            for cfg in "${CONFIGS[@]}"; do
              grep -qxF "$cfg" "$file" || echo "$cfg" >> "$file"
            done
          done

      - name: Commit perubahan defconfig dan patch kernel
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Terapkan patch Lindroid: enable semua opsi di defconfig lama dan patch kernel"
          else
            echo "Tidak ada perubahan untuk di-commit"
          fi

      - name: Push perubahan ke origin
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          git remote set-url origin "${ORIGIN_URL/https:\/\//https:\/\/${{ github.token }}@}"
          git push origin $(git branch --show-current)
