name: Buat Branch Baru & Terapkan Patch Lindroid-DRM-Loopback
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-branch-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Konfigurasi Git untuk Actions
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "GitHub Actions"

      - name: Buat branch baru
        run: |
          # Ganti NAMA_BRANCH sesuai keinginanmu
          NAMA_BRANCH="update-lindroid-drm-$(date +%Y%m%d%H%M%S)"
          git checkout -b $NAMA_BRANCH
          echo "Branch baru dibuat: $NAMA_BRANCH"

      - name: Ambil patch Lindroid-DRM-Loopback
        run: |
          git -C drivers/lindroid-drm fetch --all --tags
          git -C drivers/lindroid-drm checkout origin/master

      - name: Commit perubahan submodule jika ada
        run: |
          if [ -n "$(git status --porcelain drivers/lindroid-drm)" ]; then
            git add drivers/lindroid-drm
            git commit -m "Terapkan patch terbaru lindroid-drm-loopback"
          else
            echo "Tidak ada perubahan di lindroid-drm-loopback"

      - name: Push branch baru ke origin
        run: |
          ORIGIN_URL=$(git remote get-url origin)
          git remote set-url origin "${ORIGIN_URL/https:\/\//https:\/\/${{ github.token }}@}"
          git push origin HEAD
