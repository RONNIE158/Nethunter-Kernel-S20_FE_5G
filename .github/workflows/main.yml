name: Terapkan Patch Lindroid DRM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # Run tiap hari jam 03:00 UTC

permissions:
  contents: write

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
  KERNEL_DIR: kernel

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
    # Checkout kernel repo
    - name: Checkout Kernel
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: true

    # Checkout patch repo
    - name: Checkout Patch Lindroid DRM
      uses: actions/checkout@v3
      with:
        repository: ${{ env.PATCH_REPO }}
        path: drm-dkms
        fetch-depth: 1

    # Terapkan patch dengan symlink + append Makefile/Kconfig
    - name: Terapkan Patch
      run: |
        cd kernel

        # Buat folder drivers kalau belum ada
        mkdir -p drivers

        # Buat Makefile & Kconfig dummy jika belum ada
        [ ! -f drivers/Makefile ] && echo '# dummy Makefile' > drivers/Makefile
        [ ! -f drivers/Kconfig ] && echo '# dummy Kconfig' > drivers/Kconfig

        # Hapus symlink lama kalau ada
        [ -L drivers/lindroid-drm ] && rm drivers/lindroid-drm

        # Buat symlink ke patch
        ln -s ../drm-dkms drivers/lindroid-drm

        # Append modul & Kconfig tanpa duplikasi
        grep -qxF 'obj-y += lindroid-drm/' drivers/Makefile || echo 'obj-y += lindroid-drm/' >> drivers/Makefile
        grep -qxF 'source "drivers/lindroid-drm/Kconfig"' drivers/Kconfig || echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig

        # Cek patch valid
        FILE_COUNT=$(find drivers/lindroid-drm -type f \( -name '*.c' -o -name '*.h' \) | wc -l)
        if [ "$FILE_COUNT" -eq 0 ]; then
           echo "❌ Patch Lindroid DRM kosong atau salah!"
           exit 1
        fi

        echo "✅ Patch Lindroid DRM siap (symlink + append Makefile/Kconfig)"

    # Commit & push perubahan jika ada
    - name: Commit & Push Patch
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions"

        git add drivers/lindroid-drm drivers/Makefile drivers/Kconfig

        if git diff-index --quiet HEAD; then
          echo "Tidak ada perubahan untuk di-commit"
        else
          git commit -m "Terapkan/perbarui patch Lindroid DRM"
          ORIGIN_URL=$(git remote get-url origin)
          git remote set-url origin "${ORIGIN_URL/https:\/\//https://${{ github.token }}@}"
          git push origin $(git branch --show-current) --force-with-lease
          echo "✅ Patch berhasil di-commit & di-push"
        fi
