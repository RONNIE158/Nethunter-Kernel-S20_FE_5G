name: Kernel Patch Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
  KERNEL_DIR: kernel

jobs:
  apply-patch:
    name: Apply Kernel Patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Checkout Lindroid DRM Patch
        uses: actions/checkout@v3
        with:
          repository: ${{ env.PATCH_REPO }}
          path: drm-dkms

      - name: Apply Lindroid DRM Patch
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Pastikan direktori drivers dan lindroid-drm ada
          mkdir -p drivers/lindroid-drm

          # Buat Makefile dan Kconfig kosong jika belum ada
          [ ! -f drivers/Makefile ] && touch drivers/Makefile
          [ ! -f drivers/Kconfig ] && touch drivers/Kconfig

          # Tambah modul dan Kconfig jika belum ada
          grep -qxF 'obj-y += lindroid-drm/' drivers/Makefile || echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          grep -qxF 'source "drivers/lindroid-drm/Kconfig"' drivers/Kconfig || echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig

          # Salin semua file patch/drm ke kernel, timpa jika sudah ada
          rsync -a ../drm-dkms/ drivers/lindroid-drm/

      - name: Verify Patch Applied
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Cek Makefile & Kconfig
          if grep -q 'lindroid-drm' drivers/Makefile && grep -q 'lindroid-drm' drivers/Kconfig; then
            echo "✅ Makefile & Kconfig sudah diupdate"
          else
            echo "❌ Makefile/Kconfig gagal diupdate"
            exit 1
          fi

          # Cek file patch tidak kosong
          PATCH_FILES=$(find drivers/lindroid-drm -type f)
          if [ -z "$PATCH_FILES" ]; then
            echo "❌ Tidak ada file patch"
            exit 1
          fi

          for f in $PATCH_FILES; do
            if [ ! -s "$f" ]; then
              echo "❌ File $f kosong"
              exit 1
            fi
          done

          echo "✅ Semua file patch ada dan tidak kosong"
