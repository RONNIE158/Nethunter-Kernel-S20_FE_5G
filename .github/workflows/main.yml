name: Patch Kernel Lindroid + Sinkron Upstream

on:
  schedule:
    - cron: "0 0 * * *"  # dijalankan tiap hari
  workflow_dispatch:    # bisa dijalankan manual

permissions:
  contents: write

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback
  KERNEL_DIR: kernel

jobs:
  terapkan-dan-sync-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo Kernel
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Ambil hash awal
        id: get-initial-hash
        run: echo "init_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout Patch Lindroid DRM
        uses: actions/checkout@v3
        with:
          repository: ${{ env.PATCH_REPO }}
          path: drm-dkms

      - name: Terapkan Patch Lindroid DRM
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Pastikan folder drivers/lindroid-drm ada
          mkdir -p drivers/lindroid-drm

          # Hapus file lama jika ada
          if [ "$(ls -A drivers/lindroid-drm)" ]; then
            echo "⚠️ File lama ditemukan, menghapus semua..."
            rm -rf drivers/lindroid-drm/*
          fi

          # Salin semua file patch baru dari drm-dkms
          rsync -a ../drm-dkms/ drivers/lindroid-drm/

          # Tambahkan modul & Kconfig jika belum ada
          grep -qxF 'obj-y += lindroid-drm/' drivers/Makefile || echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          grep -qxF 'source "drivers/lindroid-drm/Kconfig"' drivers/Kconfig || echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig

          # Cek integritas patch: minimal ada file .c atau .h
          FILE_COUNT=$(find drivers/lindroid-drm -type f \( -name '*.c' -o -name '*.h' \) | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Tidak ada file .c atau .h di patch, patch kemungkinan salah"
            exit 1
          fi

          echo "✅ Patch Lindroid DRM diterapkan dengan benar"

      - name: Update Patch Lindroid DRM dari Upstream
        run: |
          git -C ${{ env.KERNEL_DIR }}/drivers/lindroid-drm fetch -a -t
          git -C ${{ env.KERNEL_DIR }}/drivers/lindroid-drm checkout origin/master

      - name: Rebase dengan Upstream
        uses: archiemeng/rebase-upstream-action@master
        with:
          branch: ${{ github.ref_name }}
          depth: 0

      - name: Ambil hash saat ini
        id: get-current-hash
        run: echo "cur_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Jalankan Build Workflow Jika Patch Berubah
        uses: benc-uk/workflow-dispatch@v1.2.4
        if: ${{ steps.get-initial-hash.outputs.init_hash != steps.get-current-hash.outputs.cur_hash }}
        with:
          workflow: build.yml
