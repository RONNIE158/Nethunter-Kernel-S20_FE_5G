name: Build Kernel with Lindroid DRM 2

on:
  workflow_dispatch:

env:
  PATCH_REPO: Linux-on-droid/lindroid-drm-loopback

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          path: kernel

      - name: Checkout Lindroid DRM Patch
        uses: actions/checkout@v3
        with:
          repository: ${{ env.PATCH_REPO }}
          path: drm-dkms

      - name: Setup Dependencies
        run: |
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install -y nano bc bison ca-certificates curl flex gcc git \
            libc6-dev libssl-dev openssl python-is-python3 ssh wget zip zstd sudo make \
            clang gcc-arm-linux-gnueabi software-properties-common build-essential \
            libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libssl-dev libffi-dev libncurses5-dev zlib1g zlib1g-dev \
            libreadline-dev libbz2-dev libsqlite3-dev \
            pigz python2 python3 cpio lld llvm libtinfo5 lz4 neofetch dos2unix

      - name: Apply Lindroid DRM Patch
        working-directory: kernel
        run: |
          echo "🔧 Applying Lindroid DRM patch..."
          if ! grep -q "lindroid-drm" drivers/Makefile; then
            echo 'obj-y += lindroid-drm/' >> drivers/Makefile
          fi
          if ! grep -q "lindroid-drm" drivers/Kconfig; then
            echo 'source "drivers/lindroid-drm/Kconfig"' >> drivers/Kconfig
          fi
          rm -rf drivers/lindroid-drm
          mkdir -p drivers/lindroid-drm
          cp -r ../drm-dkms/* drivers/lindroid-drm/

      - name: Build Kernel
        working-directory: kernel
        run: |
          set -e
          DIR=$(pwd)
          PARENT_DIR=$(readlink -f ${DIR}/..)

          DEFCONFIG_NAME=wirus_defconfig
          ARCH=arm64
          VERSION=Nethunter_WirusMOD_r8q_v4.0.1

          BUILD_CROSS_COMPILE=$DIR/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          KERNEL_LLVM_BIN=$DIR/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          KERNEL_MAKE_ENV="DTC_EXT=$DIR/tools/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y LOCALVERSION=-${VERSION}"

          [ ! -d "$PARENT_DIR/out" ] && mkdir $PARENT_DIR/out
          make -j$(nproc) -C $DIR O=$PARENT_DIR/out $KERNEL_MAKE_ENV \
            ARCH=$ARCH CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE CFP_CC=$KERNEL_LLVM_BIN $DEFCONFIG_NAME
          make -j$(nproc) -C $DIR O=$PARENT_DIR/out $KERNEL_MAKE_ENV \
            ARCH=$ARCH CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE CFP_CC=$KERNEL_LLVM_BIN

      - name: Generate AnyKernel3 Zip
        working-directory: kernel
        run: |
          DIR=$(pwd)
          PARENT_DIR=$(readlink -f ${DIR}/..)
          CHIPSET_NAME=kona
          VARIANT=r8q
          DTS_DIR=$PARENT_DIR/out/arch/$ARCH/boot/dts

          [ ! -d $PARENT_DIR/AnyKernel3 ] && cp -rf $DIR/AnyKernel3 $PARENT_DIR/AnyKernel3

          if [ -e $PARENT_DIR/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp $PARENT_DIR/out/arch/arm64/boot/Image.gz-dtb $PARENT_DIR/AnyKernel3/zImage
          elif [ -e $PARENT_DIR/out/arch/arm64/boot/Image ]; then
            gzip -c $PARENT_DIR/out/arch/arm64/boot/Image > $PARENT_DIR/out/arch/arm64/boot/Image.gz
            cp $PARENT_DIR/out/arch/arm64/boot/Image.gz $PARENT_DIR/AnyKernel3/zImage
          else
            echo "Error: kernel Image not found" && exit 1
          fi

          mkdir -p $PARENT_DIR/build/$VARIANT/modules
          find $PARENT_DIR/out/ -name '*.ko' -not -path "$PARENT_DIR/build/*" \
            -exec cp --parents -f '{}' $PARENT_DIR/build/$VARIANT/modules \;
          mv -f $PARENT_DIR/build/$VARIANT/modules/home/svirusx/out/* $PARENT_DIR/build/$VARIANT/modules

          cd $PARENT_DIR/AnyKernel3
          zip -r9 $PARENT_DIR/build/$VARIANT/${VERSION}.zip * -x .git README.md *placeholder

      - name: Upload Artifacts
        run: |
          mkdir -p artifacts
          cp -vf build/r8q/*.zip artifacts/
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build
          path: artifacts
